<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Ops Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--surface:#fff;--ink:#14202b;--muted:#5b6b79;--line:#d8dee4;--accent:#0f766e;--soft:#dff1ee}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Public Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;display:flex;justify-content:center}
.app{width:100%;max-width:760px;height:100%;display:flex;flex-direction:column;padding:0 16px}
header{padding:24px 0 16px;border-bottom:1px solid var(--line)}
h1{font-size:1.4rem;margin:0;font-weight:700;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
#log{flex:1;overflow-y:auto;padding:20px 0;display:flex;flex-direction:column;gap:16px}
.msg{max-width:88%;display:flex;flex-direction:column;gap:4px}
.msg.user{align-self:flex-end;align-items:flex-end}
.bubble{padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere}
.user .bubble{background:var(--ink);color:#fff;border-color:var(--ink)}
.bubble h3{font-size:1rem;margin:12px 0 4px}
.bubble ul{margin:6px 0;padding-left:20px}
.bubble p{margin:6px 0}
.bubble hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.bubble>:first-child{margin-top:0}
.bubble>:last-child{margin-bottom:0}
.tag{font-size:.8rem;color:var(--accent);font-weight:600}
.tag.err{color:#b42318}
.empty{margin:auto 0}
.empty h2{font-size:1.1rem;margin:0 0 4px}
.empty p{margin:0 0 14px;color:var(--muted)}
.chips{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chip{font:inherit;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent);background:var(--soft)}
form{display:flex;gap:8px;padding:12px 0 20px}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.send{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 20px;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dots span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Personal Ops Copilot</h1>
    <p>Ask about your meetings, emails and leads. Each question is routed to its own agent.</p>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <input id="q" type="text" placeholder="Ask about meetings, emails or leads" autocomplete="off" aria-label="Your question">
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>
<script>
const WEBHOOK = "https://hook.eu1.make.com/2rr9jjsnrid5idmxxibsc2v5rqjsbrdo";
const SUGGESTIONS = ["What meetings do I have?", "Show my emails", "Which leads need follow-up?"];
const log = document.getElementById("log"), form = document.getElementById("form"),
      input = document.getElementById("q"), send = document.getElementById("send");

function agentFor(q) {
  q = q.toLowerCase();
  if (q.includes("meeting")) return "Calendar agent";
  if (q.includes("mail")) return "Email agent";
  if (q.includes("lead")) return "Leads agent";
  return null;
}
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function inline(s) { return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>"); }
function md(text) {
  let html = "", inList = false;
  for (const raw of esc(text).split("\n")) {
    const line = raw.trim();
    const bullet = line.match(/^[*-]\s+(.*)/);
    if (bullet) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + inline(bullet[1]) + "</li>"; continue; }
    if (inList) { html += "</ul>"; inList = false; }
    if (!line) continue;
    if (/^-{3,}$/.test(line)) html += "<hr>";
    else if (/^#{1,6}\s/.test(line)) html += "<h3>" + inline(line.replace(/^#+\s*/, "")) + "</h3>";
    else html += "<p>" + inline(line) + "</p>";
  }
  return inList ? html + "</ul>" : html;
}
function addMsg(who, html, tag, isErr) {
  const m = document.createElement("div");
  m.className = "msg " + who;
  m.innerHTML = '<div class="bubble">' + html + "</div>" + (tag ? '<span class="tag' + (isErr ? " err" : "") + '">' + tag + "</span>" : "");
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return m;
}
function showEmpty() {
  const e = document.createElement("div");
  e.className = "empty"; e.id = "empty";
  e.innerHTML = "<h2>What do you want to check?</h2><p>Pick a question or type your own.</p>";
  const c = document.createElement("div"); c.className = "chips";
  SUGGESTIONS.forEach(s => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = s;
    b.onclick = () => ask(s);
    c.appendChild(b);
  });
  e.appendChild(c); log.appendChild(e);
}
async function ask(q) {
  q = q.trim();
  if (!q || send.disabled) return;
  const empty = document.getElementById("empty"); if (empty) empty.remove();
  input.value = ""; send.disabled = true;
  addMsg("user", esc(q));
  const wait = addMsg("bot", '<span class="dots"><span></span><span></span><span></span></span>');
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 90000);
  try {
    const res = await fetch(WEBHOOK + "?question=" + encodeURIComponent(q), { signal: ctrl.signal });
    const text = (await res.text()).trim();
    wait.remove();
    if (!text || text === "Accepted") {
      addMsg("bot", "I can answer questions about your meetings, emails and leads. Try one of the suggested questions.");
    } else {
      const a = agentFor(q);
      addMsg("bot", md(text), a ? "Answered by " + a : "");
    }
  } catch (err) {
    wait.remove();
    addMsg("bot", err.name === "AbortError" ? "The agent took too long to answer. Try again." : "Could not reach the agents. Check that the Make scenario is active, then try again.", "Error", true);
  } finally {
    clearTimeout(timer); send.disabled = false; input.focus();
  }
}
form.addEventListener("submit", e => { e.preventDefault(); ask(input.value); });
showEmpty();
</script>
</body>
</html>
